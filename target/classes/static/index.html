<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход сотрудника</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f0f2f5; margin: 0; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 300px; }
        h2 { text-align: center; color: #333; }
        label { display: block; margin-top: 10px; font-weight: bold; }
        select, input, button { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { background: #007bff; color: white; border: none; cursor: pointer; margin-top: 20px; font-size: 16px; }
        button:hover { background: #0056b3; }
        .error { color: red; font-size: 14px; text-align: center; margin-top: 10px; display: none; }
        #workPanel { display: none; text-align: center; }
        .status-badge { display: inline-block; padding: 5px 10px; background: #e2e6ea; border-radius: 15px; font-size: 12px; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="card" id="loginCard">
    <h2>Вход в систему</h2>
    <label for="fullNameSelect">Выберите ФИО:</label>
    <select id="fullNameSelect">
        <option value="">Загрузка...</option>
    </select>

    <label for="password">Пароль:</label>
    <input type="password" id="password" placeholder="Введите пароль">

    <div id="errorMsg" class="error"></div>
    <button onclick="login()">Войти</button>
    <div style="margin-top:10px; text-align:center; font-size:12px;">
        <a href="admin.html">Вход для администратора</a>
    </div>
</div>

<div class="card" id="workPanel">
    <h2 id="welcomeText"></h2>
    <div id="statusBadge" class="status-badge">Статус: Не активен</div>
    <p id="geoStatus" style="font-size:12px; color:#666;">Геолокация: ожидание...</p>
    
    <button id="actionBtn" onclick="toggleWork()">Начать смену</button>
    <button onclick="logout()" style="background:#6c757d; margin-top:10px;">Выйти</button>
</div>

<script>
    let currentUser = null;
    let currentWorkId = null;
    let isWorking = false;
    let userLat = null;
    let userLon = null;

    // Загрузка списка сотрудников при старте
    window.onload = async () => {
        try {
            const res = await fetch('/api/employees/list');
            const employees = await res.json();
            const select = document.getElementById('fullNameSelect');
            select.innerHTML = '<option value="">-- Выберите сотрудника --</option>';
            employees.forEach(emp => {
                const opt = document.createElement('option');
                opt.value = emp.fullName;
                opt.textContent = emp.fullName;
                select.appendChild(opt);
            });
        } catch (e) {
            console.error("Ошибка загрузки списка", e);
        }
        
        // Получение геолокации сразу
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(pos => {
                userLat = pos.coords.latitude;
                userLon = pos.coords.longitude;
                document.getElementById('geoStatus').textContent = `Geo: ${userLat.toFixed(4)}, ${userLon.toFixed(4)}`;
            }, err => {
                document.getElementById('geoStatus').textContent = "Ошибка GPS: " + err.message;
            });
        }
    };

    async function login() {
        const fullName = document.getElementById('fullNameSelect').value;
        const password = document.getElementById('password').value;
        const errorDiv = document.getElementById('errorMsg');

        if (!fullName || !password) {
            errorDiv.textContent = "Заполните все поля";
            errorDiv.style.display = 'block';
            return;
        }

        try {
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ fullName, password })
            });

            if (res.ok) {
                currentUser = await res.json();
                showWorkPanel();
            } else {
                errorDiv.textContent = await res.text();
                errorDiv.style.display = 'block';
            }
        } catch (e) {
            errorDiv.textContent = "Ошибка соединения";
            errorDiv.style.display = 'block';
        }
    }

    function showWorkPanel() {
        document.getElementById('loginCard').style.display = 'none';
        document.getElementById('workPanel').style.display = 'block';
        document.getElementById('welcomeText').textContent = `Привет, ${currentUser.fullName}`;
        checkActiveWork();
    }

    async function checkActiveWork() {
        // Упрощенно: проверяем историю, последняя запись активна?
        // В реальном проекте лучше отдельный эндпоинт статуса
        const res = await fetch(`/api/work/history/${currentUser.id}`);
        const records = await res.json();
        const active = records.find(r => r.status === 'ACTIVE');
        
        if (active) {
            isWorking = true;
            currentWorkId = active.id;
            updateUI(true);
        } else {
            updateUI(false);
        }
    }

    function updateUI(working) {
        const btn = document.getElementById('actionBtn');
        const badge = document.getElementById('statusBadge');
        if (working) {
            btn.textContent = "Завершить смену";
            btn.style.background = "#dc3545";
            badge.textContent = "Статус: Работает";
            badge.style.background = "#d4edda";
            badge.style.color = "#155724";
        } else {
            btn.textContent = "Начать смену";
            btn.style.background = "#28a745";
            badge.textContent = "Статус: Не активен";
            badge.style.background = "#e2e6ea";
            badge.style.color = "#333";
        }
    }

    async function toggleWork() {
        if (!userLat || !userLon) {
            alert("Нет данных геолокации. Разрешите доступ к GPS.");
            return;
        }

        if (isWorking) {
            // Завершить
            const res = await fetch(`/api/work/finish/${currentWorkId}`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ latitude: userLat, longitude: userLon })
            });
            if(res.ok) {
                isWorking = false;
                currentWorkId = null;
                updateUI(false);
                alert("Смена завершена!");
            }
        } else {
            // Начать
            const res = await fetch('/api/work/start', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ employeeId: currentUser.id, latitude: userLat, longitude: userLon })
            });
            if(res.ok) {
                const data = await res.json();
                isWorking = true;
                currentWorkId = data.id;
                updateUI(true);
            }
        }
    }

    function logout() {
        location.reload();
    }
</script>
</body>
</html>
