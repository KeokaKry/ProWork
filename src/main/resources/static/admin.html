<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #2c3e50 0%, #3498db 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 30px;
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }
        
        input, select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: #3498db;
        }
        
        button {
            padding: 12px 25px;
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-right: 10px;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(52, 152, 219, 0.4);
        }
        
        button.delete-btn {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 30px;
        }
        
        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }
        
        th {
            background: #f8f9fa;
            font-weight: 600;
            color: #333;
        }
        
        tr:hover {
            background: #f8f9fa;
        }
        
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: white;
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            z-index: 1000;
            transform: translateX(400px);
            transition: transform 0.3s;
        }
        
        .notification.show {
            transform: translateX(0);
        }
        
        .notification.success {
            border-left: 4px solid #4CAF50;
        }
        
        .notification.error {
            border-left: 4px solid #f44336;
        }
        
        .actions {
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }
        
        .actions h2 {
            margin-bottom: 20px;
            color: #333;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div id="notification" class="notification">
        <span id="notification-text"></span>
    </div>

    <div class="container">
        <h1>🔧 Админ-панель: Управление сотрудниками</h1>
        
        <!-- Форма создания/редактирования -->
        <div class="actions">
            <h2 id="form-title">➕ Создать сотрудника</h2>
            <input type="hidden" id="employee-id">
            
            <div class="form-row">
                <div class="form-group">
                    <label for="fullName">ФИО</label>
                    <input type="text" id="fullName" placeholder="Иванов Иван Иванович" required>
                </div>
                
                <div class="form-group">
                    <label for="position">Должность</label>
                    <select id="position" required>
                        <option value="">Выберите должность</option>
                        <option value="Электрик">Электрик</option>
                        <option value="Сантехник">Сантехник</option>
                        <option value="Строитель">Строитель</option>
                        <option value="Уборщик">Уборщик</option>
                        <option value="Охранник">Охранник</option>
                        <option value="Другое">Другое</option>
                    </select>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="username">Логин (телефон)</label>
                    <input type="text" id="username" placeholder="+79001234567" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" placeholder="••••" required minlength="4">
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="phoneNumber">Телефон</label>
                    <input type="text" id="phoneNumber" placeholder="+79001234567">
                </div>
                
                <div class="form-group">
                    <label for="hourlyRate">Ставка в час (руб)</label>
                    <input type="number" id="hourlyRate" placeholder="500" step="0.01" min="0">
                </div>
            </div>
            
            <button onclick="saveEmployee()" id="save-btn">💾 Сохранить</button>
            <button onclick="clearForm()" style="background: #95a5a6;">✖ Очистить</button>
        </div>
        
        <!-- Таблица сотрудников -->
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>ФИО</th>
                    <th>Должность</th>
                    <th>Логин</th>
                    <th>Телефон</th>
                    <th>Ставка</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody id="employees-table">
            </tbody>
        </table>
    </div>

    <script>
        const API_URL = '/api/admin/employees';
        let editingId = null;

        document.addEventListener('DOMContentLoaded', () => {
            loadEmployees();
        });

        async function loadEmployees() {
            try {
                const response = await fetch(API_URL);
                const employees = await response.json();
                
                const tbody = document.getElementById('employees-table');
                tbody.innerHTML = '';
                
                employees.forEach(emp => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${emp.id}</td>
                        <td>${emp.fullName || '-'}</td>
                        <td>${emp.position || '-'}</td>
                        <td>${emp.username || '-'}</td>
                        <td>${emp.phoneNumber || '-'}</td>
                        <td>${emp.hourlyRate || '0'}</td>
                        <td>
                            <button onclick="editEmployee(${emp.id})">✏️</button>
                            <button class="delete-btn" onclick="deleteEmployee(${emp.id})">🗑️</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                showNotification('Ошибка загрузки сотрудников', 'error');
                console.error(error);
            }
        }

        async function saveEmployee() {
            const fullName = document.getElementById('fullName').value.trim();
            const position = document.getElementById('position').value;
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const phoneNumber = document.getElementById('phoneNumber').value.trim();
            const hourlyRate = parseFloat(document.getElementById('hourlyRate').value) || 0;

            if (!fullName || !position || !username || !password) {
                showNotification('Заполните обязательные поля', 'error');
                return;
            }

            const employee = {
                fullName,
                position,
                username,
                password,
                phoneNumber,
                hourlyRate
            };

            try {
                let response;
                if (editingId) {
                    // Обновление
                    response = await fetch(`${API_URL}/${editingId}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(employee)
                    });
                } else {
                    // Создание
                    response = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(employee)
                    });
                }

                const data = await response.json();
                
                if (response.ok) {
                    showNotification(editingId ? 'Сотрудник обновлен' : 'Сотрудник создан', 'success');
                    clearForm();
                    loadEmployees();
                } else {
                    showNotification(data || 'Ошибка сохранения', 'error');
                }
            } catch (error) {
                showNotification('Ошибка соединения с сервером', 'error');
                console.error(error);
            }
        }

        function editEmployee(id) {
            editingId = id;
            document.getElementById('form-title').textContent = '✏️ Редактировать сотрудника';
            document.getElementById('employee-id').value = id;
            document.getElementById('save-btn').textContent = '💾 Обновить';
            
            // Загружаем данные сотрудника (можно сделать отдельный запрос)
            // Для простоты берем из таблицы
            const row = event.target.closest('tr');
            document.getElementById('fullName').value = row.cells[1].textContent;
            document.getElementById('position').value = row.cells[2].textContent;
            document.getElementById('username').value = row.cells[3].textContent;
            document.getElementById('phoneNumber').value = row.cells[4].textContent;
            document.getElementById('hourlyRate').value = row.cells[5].textContent;
            document.getElementById('password').value = '';
        }

        async function deleteEmployee(id) {
            if (!confirm('Вы уверены, что хотите удалить этого сотрудника?')) {
                return;
            }

            try {
                const response = await fetch(`${API_URL}/${id}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    showNotification('Сотрудник удален', 'success');
                    loadEmployees();
                    if (editingId === id) {
                        clearForm();
                    }
                } else {
                    showNotification('Ошибка удаления', 'error');
                }
            } catch (error) {
                showNotification('Ошибка соединения с сервером', 'error');
                console.error(error);
            }
        }

        function clearForm() {
            editingId = null;
            document.getElementById('form-title').textContent = '➕ Создать сотрудника';
            document.getElementById('employee-id').value = '';
            document.getElementById('save-btn').textContent = '💾 Сохранить';
            document.getElementById('fullName').value = '';
            document.getElementById('position').value = '';
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
            document.getElementById('phoneNumber').value = '';
            document.getElementById('hourlyRate').value = '';
        }

        function showNotification(message, type) {
            const notification = document.getElementById('notification');
            const text = document.getElementById('notification-text');
            text.textContent = message;
            notification.className = `notification ${type} show`;
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }
    </script>
</body>
</html>
