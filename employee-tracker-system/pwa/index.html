<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Приложение для учета рабочего времени сотрудников">
    <meta name="theme-color" content="#4CAF50">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="WorkTracker">
    
    <title>WorkTracker - Учет рабочего времени</title>
    
    <!-- Подключение манифеста PWA -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Иконки для iOS -->
    <link rel="apple-touch-icon" href="icon-192.png">
    
    <!-- Стили -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>⏰ WorkTracker</h1>
        
        <!-- Экран регистрации/входа -->
        <div id="auth-screen" class="card">
            <h2 class="card-title">Регистрация / Вход</h2>
            <form id="auth-form">
                <div class="form-group">
                    <label for="fullName">ФИО *</label>
                    <input type="text" id="fullName" required placeholder="Иванов Иван Иванович">
                </div>
                
                <div class="form-group">
                    <label for="phoneNumber">Телефон *</label>
                    <input type="tel" id="phoneNumber" required placeholder="+7 (999) 123-45-67">
                </div>
                
                <div class="form-group">
                    <label for="position">Должность *</label>
                    <select id="position" required>
                        <option value="">Выберите должность</option>
                        <option value="Электрик">Электрик</option>
                        <option value="Сантехник">Сантехник</option>
                        <option value="Строитель">Строитель</option>
                        <option value="Отделочник">Отделочник</option>
                        <option value="Грузчик">Грузчик</option>
                        <option value="Разнорабочий">Разнорабочий</option>
                        <option value="Мастер">Мастер</option>
                        <option value="Другое">Другое</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="password">Пароль *</label>
                    <input type="password" id="password" required placeholder="Минимум 4 символа" minlength="4">
                </div>
                
                <button type="submit" class="btn btn-primary btn-full">Зарегистрироваться / Войти</button>
            </form>
        </div>
        
        <!-- Основной экран сотрудника -->
        <div id="employee-screen" class="hidden">
            <!-- Информация о сотруднике -->
            <div class="card">
                <h2 class="card-title">👤 Сотрудник</h2>
                <p><strong>ФИО:</strong> <span id="employee-name"></span></p>
                <p><strong>Должность:</strong> <span id="employee-position"></span></p>
                <p><strong>Геозона:</strong> <span id="employee-geozone"></span></p>
                <button onclick="logout()" class="btn btn-secondary btn-full">Выйти</button>
            </div>
            
            <!-- Статус геолокации -->
            <div id="geo-status-card" class="card hidden">
                <h2 class="card-title">📍 Геолокация</h2>
                <div id="geo-status-content"></div>
            </div>
            
            <!-- Задания на неделю -->
            <div id="tasks-card" class="card hidden">
                <h2 class="card-title">📋 Задания на неделю</h2>
                <ul id="task-list" class="task-list"></ul>
            </div>
            
            <!-- Текущий рабочий день -->
            <div id="work-day-card" class="card">
                <h2 class="card-title">🕐 Рабочий день</h2>
                
                <!-- Статус дня -->
                <div id="day-status" class="status-badge status-not-started">Не начат</div>
                
                <!-- Таймер -->
                <div id="timer-container" class="hidden">
                    <div class="timer-display" id="timer">00:00:00</div>
                </div>
                
                <!-- Кнопки действий -->
                <div id="action-buttons">
                    <button id="btn-start-work" class="btn btn-primary btn-full hidden" onclick="startWork()">
                        🚀 Начать рабочий день
                    </button>
                    
                    <button id="btn-start-break" class="btn btn-warning btn-full hidden" onclick="toggleBreak()">
                        ☕ Перерыв (10 мин)
                    </button>
                    
                    <button id="btn-start-lunch" class="btn btn-secondary btn-full hidden" onclick="toggleLunch()">
                        🍽️ Обед (1 час)
                    </button>
                    
                    <button id="btn-end-work" class="btn btn-danger btn-full hidden" onclick="showEndWorkForm()">
                        ✅ Завершить рабочий день
                    </button>
                </div>
                
                <!-- Форма завершения дня -->
                <div id="end-work-form" class="hidden" style="margin-top: 20px;">
                    <div class="form-group">
                        <label for="work-comment">Комментарий о выполненной работе *</label>
                        <textarea id="work-comment" required placeholder="Опишите, что было сделано за день..."></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label>Фотографии выполненной работы (до 10 шт)</label>
                        <input type="file" id="work-photos" accept="image/*" multiple capture="environment">
                        <div id="photo-preview" class="photo-grid"></div>
                    </div>
                    
                    <button class="btn btn-primary btn-full" onclick="submitEndWork()">Отправить и завершить</button>
                    <button class="btn btn-secondary btn-full" onclick="hideEndWorkForm()">Отмена</button>
                </div>
            </div>
            
            <!-- История рабочих дней -->
            <div id="history-card" class="card hidden">
                <h2 class="card-title">📊 История</h2>
                <div id="history-list"></div>
            </div>
        </div>
    </div>
    
    <!-- Подключение основного скрипта -->
    <script src="app.js"></script>
</body>
</html>
